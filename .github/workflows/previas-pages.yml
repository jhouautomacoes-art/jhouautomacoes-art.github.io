name: Site e limpeza de previas

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: jhou-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.clean.outputs.publish }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - name: Validar regras das demonstracoes
        run: node --test tests/test_service_model.cjs tests/test_business_model.cjs
      - name: Validar e remover amostras vencidas
        id: clean
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/previas.py check
          python3 scripts/previas.py clean
          if ! git diff --quiet -- previas.html; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- previas.html
            git commit -m 'Remover amostras temporarias vencidas'
            git pull --rebase origin main
            git push origin HEAD:main
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" != 'schedule' ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Montar somente os arquivos publicos do site
        if: steps.clean.outputs.publish == 'true'
        run: python3 scripts/previas.py build
      - name: Guardar site para publicacao
        if: steps.clean.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
          retention-days: 1

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
